services:
  web:
    image: httpd:2.4
    ports:
      - "80:80"
    volumes:
      - ./Frontend:/usr/local/apache2/htdocs:ro
    restart: unless-stopped

  employe:
    image: devlog-employe:${VERSION:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/employe
    volumes:
      - ./data/employe:/data
    ports:
      - "8081:8081"
    restart: unless-stopped

  entreprise:
    image: devlog-entreprise:${VERSION:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/entreprise
    volumes:
      - ./data/entreprise:/data
    ports:
      - "8080:8080"
    restart: unless-stopped
