# Compose utilisé par la CI/CD (ci/deploy.sh). Il lance les JAR packagés,
# avec une version (tag) par image pour permettre le rollback.
# Ton docker-compose.yml d'origine (dev) n'est pas modifié.
services:
  web:
    image: httpd:2.4
    ports:
      - "80:80"
    volumes:
      - ./Frontend:/usr/local/apache2/htdocs:ro
    restart: unless-stopped

  employe:
    image: devlog-employe:${VERSION:-latest}
    ports:
      - "8081:8081"
    restart: unless-stopped

  entreprise:
    image: devlog-entreprise:${VERSION:-latest}
    ports:
      - "8080:8080"
    restart: unless-stopped
