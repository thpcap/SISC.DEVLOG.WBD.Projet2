<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Découvrez les entreprises référencées sur notre plateforme.">
    <title>Entreprises</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav container" aria-label="Navigation principale">
            <a class="brand" href="Entreprise.html" aria-label="Accueil Entreprises">
                Entreprises
            </a>
            <a class="nav-link active" href="Entreprise.html" aria-current="page">Annuaire</a>
        </nav>
    </header>

    <main class="container page-content">
        <section class="hero">
            <span class="eyebrow">Annuaire professionnel</span>
            <h1>Découvrez nos entreprises</h1>
            <p class="description">Retrouvez les entreprises référencées et consultez leurs équipes en un clic.</p>
        </section>

        <section class="card company" aria-labelledby="companies-title">
            <div class="section-heading">
                <div>
                    <h2 id="companies-title">Tableau des entreprises</h2>
                    <p><span id="entreprisesNumber"></span> entreprises disponible</p>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col"><input type="text" name="" id="EntrepriseInput" oninput="filter();" placeholder="Entreprise"></th>
                            <th scope="col">
                                <select name="Secteur" id="SecteurInput">
                                    <option value="" selected>Secteur</option>
                                </select>
                            </th>
                            <th scope="col">
                                <select name="Taille" id="TailleInput">
                                    <option value="" selected>Taille</option>
                                </select>
                            </th>
                            <th scope="col">
                                 <select name="Ville" id="VilleInput">
                                    <option value="" selected>Ville</option>
                                </select>
                            </th>
                            <th scope="col"><button onclick="reloadTable()">Rechercher</button><span class="sr-only">Action</span></th>
                        </tr>
                        
                    </thead>
                    <tbody id="tableBodyEntreprise">
                       
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer><div class="container">Copyright © 2026 · Annuaire des entreprises</div></footer>
    <script src="/JS/Entreprise.js"></script>
    <script id="Conf">
        var APILink = "http://localhost:8080/api/";
        var DetailsPageLink ="details.html?id=";
    </script>
</body>
</html>
